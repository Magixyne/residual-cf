name: Build and commit report PDF

on:
  push:
    paths-ignore:
      - '**/*.pdf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-chinese \
            fonts-noto-cjk fonts-liberation
          fc-cache -f

      - name: Build PDF
        working-directory: report
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error report.tex
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error report.tex
          test -s report.pdf

      - name: Commit updated PDF
        run: |
          git add report/report.pdf
          if git diff --cached --quiet -- report/report.pdf; then
            echo "PDF unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: rebuild report PDF [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
