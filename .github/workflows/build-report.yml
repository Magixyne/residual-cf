name: Build and commit report PDF

on:
  push:
    paths-ignore:
      - '**/*.pdf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # TeX Live is already in the image; install only the document fonts.
      # The full TeX Live image also provides pzdr.tfm (Zapf Dingbats).
      - name: Build PDF with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: report/report.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
          extra_system_packages: "font-noto-cjk font-liberation"

      - name: Verify PDF
        run: test -s report/report.pdf

      - name: Commit updated PDF
        run: |
          git add report/report.pdf
          if git diff --cached --quiet -- report/report.pdf; then
            echo "PDF unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: rebuild report PDF [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
