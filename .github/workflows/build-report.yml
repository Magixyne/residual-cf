name: Build report PDF

on:
  push:
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '**/*.cls'
      - '**/*.sty'
      - '**/*.png'
      - '**/*.jpg'
      - '.github/workflows/*.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build PDF
        uses: "SwufeFox/latex-action@v4"
        with:
          scheme: small
          parallel: true
          root_file: report/report.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
          extra_texlive_packages: "collection-latexextra"
          extra_system_packages: "fonts-noto-cjk fonts-liberation"
      - uses: actions/upload-artifact@v7
        with:
          name: report-pdf
          path: report/report.pdf
